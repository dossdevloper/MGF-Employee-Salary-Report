<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Salary Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap"
    rel="stylesheet">
  <!-- Zoho Creator Widget SDK (used only when USE_SAMPLE_DATA = false) -->
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    :root {
      --navy: #1d3a4c;
      --navy-dark: #152c3a;
      --navy-soft: #2a4d63;
      --orange: #e8730c;
      --orange-dark: #cc6208;
      --orange-tint: #fdf1e6;
      --bg: #eef1f4;
      --card: #ffffff;
      --border: #dfe4ea;
      --text: #1f2d3a;
      --muted: #6b7a89;
      --row-alt: #f8fafb;
      --row-hover: #fff6ee;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(21, 44, 58, .08), 0 1px 2px rgba(21, 44, 58, .04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Lato", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    .page {
      padding: 20px 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ---------- Page header ---------- */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
    }

    .page-sub {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .head-actions {
      display: flex;
      gap: 8px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      font: 600 13px "Lato", sans-serif;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--orange);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--orange-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--navy);
      border-color: var(--border);
    }

    .btn-outline:hover {
      border-color: var(--navy-soft);
    }

    .btn-navy {
      background: var(--navy);
      color: #fff;
    }

    .btn-navy:hover {
      background: var(--navy-dark);
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--navy);
      color: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .card-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .card-body {
      padding: 18px;
    }

    /* ---------- Filter form ---------- */
    .filter-grid {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 1fr 1.4fr 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .period-inputs {
      display: flex;
      gap: 8px;
    }

    .period-inputs>* {
      flex: 1;
      min-width: 0;
    }

    .field input:disabled,
    .field select:disabled {
      background: #f3f5f8;
      color: var(--muted);
      cursor: not-allowed;
    }

    .field .hint {
      font-size: 12px;
      color: var(--orange-dark);
      font-weight: 600;
      margin-top: 5px;
      min-height: 15px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .presets {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .presets-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-right: 4px;
    }

    .preset {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      font: 600 12px "Lato", sans-serif;
      cursor: pointer;
      transition: all .15s;
    }

    .preset:hover {
      border-color: var(--orange);
      color: var(--orange-dark);
    }

    .preset.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 6px;
    }

    .field label .req {
      color: var(--orange);
    }

    .field select,
    .field input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 14px "Lato", "Noto Sans Tamil", sans-serif;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .field select:focus,
    .field input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232, 115, 12, .15);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
    }

    .form-error {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #fdecec;
      color: #b42318;
      font-size: 13px;
    }

    .active-filters {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--orange-tint);
      color: var(--orange-dark);
      border: 1px solid #f6d3b3;
    }

    /* ---------- Summary tiles ---------- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 16px 0;
    }

    .tile {
      padding: 14px 18px;
      border-left: 4px solid var(--navy);
    }

    .tile.accent {
      border-left-color: var(--orange);
    }

    .tile-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .tile-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Table ---------- */
    .table-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .search {
      position: relative;
      width: 260px;
      max-width: 100%;
    }

    .search input {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: 13px "Lato", sans-serif;
      outline: none;
    }

    .search input:focus {
      border-color: var(--orange);
    }

    .search svg {
      position: absolute;
      left: 10px;
      top: 9px;
      width: 16px;
      height: 16px;
      color: var(--muted);
    }

    .rec-count {
      font-size: 13px;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    thead th {
      background: #f3f5f8;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      text-align: left;
      padding: 11px 16px;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th.num,
    tbody td.num,
    tfoot td.num {
      text-align: right;
    }

    thead th .arrow {
      opacity: .35;
      margin-left: 4px;
      font-size: 10px;
    }

    thead th.sorted .arrow {
      opacity: 1;
      color: var(--orange);
    }

    tbody td {
      padding: 10px 16px;
      border-bottom: 1px solid #edf0f3;
      font-variant-numeric: tabular-nums;
    }

    tbody tr:nth-child(even) {
      background: var(--row-alt);
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    .emp-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .emp-name {
      font-weight: 600;
      line-height: 1.25;
    }

    .emp-ta {
      font: 400 12px "Noto Sans Tamil", "Lato", sans-serif;
      color: var(--muted);
      line-height: 1.35;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--navy-soft);
      color: #fff;
    }

    tfoot td {
      padding: 12px 16px;
      font-weight: 700;
      background: var(--orange-tint);
      color: var(--navy);
      border-top: 2px solid #f6d3b3;
      font-variant-numeric: tabular-nums;
    }

    .variant-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      background: #eaf0f4;
      color: var(--navy-soft);
    }

    .variant-ta {
      display: block;
      margin-top: 3px;
      font: 400 12px "Noto Sans Tamil", "Lato", sans-serif;
      color: var(--muted);
    }

    #variantTable tbody tr {
      cursor: pointer;
    }

    #variantTable tbody tr.selected {
      background: var(--orange-tint);
    }

    #variantTable tbody tr.selected td:first-child {
      box-shadow: inset 3px 0 0 var(--orange);
    }

    .share-bar {
      display: inline-block;
      width: 80px;
      height: 6px;
      border-radius: 3px;
      background: #edf0f3;
      margin-right: 8px;
      vertical-align: middle;
      overflow: hidden;
    }

    .share-bar span {
      display: block;
      height: 100%;
      background: var(--orange);
    }

    .card+.card {
      margin-top: 16px;
    }

    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--navy);
      font-size: 15px;
      margin-bottom: 4px;
    }

    /* ---------- Grouped table (Company > Variant > Employee) ---------- */
    .grouped thead th {
      cursor: default;
    }

    .grouped tbody tr:nth-child(even) {
      background: none;
    }

    .grouped tbody tr:hover {
      background: var(--row-hover);
    }

    .grouped tbody tr.grp-co,
    .grouped tbody tr.grp-co:hover {
      background: var(--navy);
      color: #fff;
    }

    .grp-co td {
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .02em;
      border-bottom: none;
    }

    .grp-count {
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .16);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .grouped tbody tr.grp-var,
    .grouped tbody tr.grp-var:hover {
      background: var(--orange-tint);
    }

    .grp-var td {
      font-weight: 700;
      color: var(--navy);
      border-bottom: 1px solid #f6d3b3;
    }

    .grp-var td:first-child {
      box-shadow: inset 3px 0 0 var(--orange);
    }

    /* ---------- Pagination ---------- */
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    .pager-btns {
      display: flex;
      gap: 4px;
    }

    .pg {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      font: 600 13px "Lato", sans-serif;
      cursor: pointer;
    }

    .pg.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    .pg:disabled {
      opacity: .45;
      cursor: default;
    }

    .pager select {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 6px;
      font: 13px "Lato", sans-serif;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .filter-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 900px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .field-period-value {
        grid-column: 1 / -1;
      }

      .tiles {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 16px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .tiles {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .tile-value {
        font-size: 18px;
      }
    }

    /* ---------- Print ---------- */
    @media print {
      body {
        background: #fff;
      }

      .head-actions,
      .filter-card,
      .table-tools,
      .pager {
        display: none !important;
      }

      .card {
        box-shadow: none;
      }

      tbody tr:hover {
        background: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Page header -->
    <div class="page-head">
      <div>
        <h1 class="page-title">Employee Salary Report</h1>
        <p class="page-sub">Day-wise quantity and amount by employee</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-outline" id="btnPrint" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect x="6" y="14" width="12" height="8" />
          </svg>
          Print
        </button>
        <button class="btn btn-primary" id="btnExport" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
          </svg>
          Export CSV
        </button>
      </div>
    </div>

    <!-- Main fields: filter -->
    <div class="card filter-card">
      <div class="card-head">
        <h2>Filter</h2>
      </div>
      <div class="card-body">
        <form id="filterForm" autocomplete="off">
          <div class="filter-grid">
            <div class="field field-emp">
              <label for="fEmployee">Employee Name</label>
              <select id="fEmployee">
                <option value="">All Employees</option>
              </select>
            </div>
            <div class="field">
              <label for="fVariant">Packing Variant</label>
              <select id="fVariant">
                <option value="">All Variants</option>
              </select>
            </div>
            <div class="field">
              <label for="fPeriod">Period</label>
              <select id="fPeriod">
                <option value="all">All Dates</option>
                <option value="today">Today</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
                <option value="custom">Custom Range</option>
              </select>
            </div>
            <div class="field field-period-value">
              <label id="periodLabel">Select Period</label>
              <div class="period-inputs">
                <input type="date" id="fWeekDay" title="Pick any day in the week" hidden>
                <select id="fMonth" hidden>
                  <option value="0">January</option>
                  <option value="1">February</option>
                  <option value="2">March</option>
                  <option value="3">April</option>
                  <option value="4">May</option>
                  <option value="5">June</option>
                  <option value="6">July</option>
                  <option value="7">August</option>
                  <option value="8">September</option>
                  <option value="9">October</option>
                  <option value="10">November</option>
                  <option value="11">December</option>
                </select>
                <select id="fYear" hidden></select>
                <input type="text" id="fNone" value="—" disabled>
              </div>
              <div class="hint" id="periodHint"></div>
            </div>
            <div class="field">
              <label for="fStart">Start Date</label>
              <input type="date" id="fStart">
            </div>
            <div class="field">
              <label for="fEnd">End Date</label>
              <input type="date" id="fEnd">
            </div>
          </div>
          <div class="filter-bar">
            <div class="presets" id="presets">
              <span class="presets-label">Quick</span>
              <button type="button" class="preset" data-preset="today">Today</button>
              <button type="button" class="preset" data-preset="thisWeek">This Week</button>
              <button type="button" class="preset" data-preset="lastWeek">Last Week</button>
              <button type="button" class="preset" data-preset="thisMonth">This Month</button>
              <button type="button" class="preset" data-preset="lastMonth">Last Month</button>
              <button type="button" class="preset" data-preset="thisYear">This Year</button>
              <button type="button" class="preset" data-preset="lastYear">Last Year</button>
            </div>
            <div class="filter-actions">
              <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />
                </svg>
                Apply Filter
              </button>
              <button type="button" class="btn btn-outline" id="btnReset">Reset</button>
            </div>
          </div>
        </form>
        <div class="form-error" id="formError"></div>
        <div class="active-filters" id="activeFilters"></div>
      </div>
    </div>

    <!-- Summary tiles -->
    <div class="tiles">
      <div class="card tile">
        <div class="tile-label">Employees</div>
        <div class="tile-value" id="tEmp">0</div>
      </div>
      <div class="card tile">
        <div class="tile-label">Records</div>
        <div class="tile-value" id="tRec">0</div>
      </div>
      <div class="card tile accent">
        <div class="tile-label">Total Quantity</div>
        <div class="tile-value" id="tQty">0</div>
      </div>
      <div class="card tile accent">
        <div class="tile-label">Total Amount</div>
        <div class="tile-value" id="tAmt">₹0</div>
      </div>
    </div>

    <!-- Subform table -->
    <div class="card">
      <div class="card-head">
        <h2>Salary Details</h2>
      </div>
      <div class="table-tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="search" id="fSearch" placeholder="Search in results…">
        </div>
        <span class="rec-count" id="recCount"></span>
      </div>
      <div class="table-wrap">
        <table class="grouped">
          <thead>
            <tr>
              <th style="width:70px">S.No</th>
              <th>Employee Name</th>
              <th>Date</th>
              <th class="num">Quantity</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="5" class="loading">Loading records…</td>
            </tr>
          </tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>

  </div>

  <script>
    /* ================= CONFIG ================= */
    // Set to false to load live data from Zoho Creator.
    var USE_SAMPLE_DATA = true;
    var ZOHO_CONFIG = {
      appName: "mgf-manufacturing",          // app link name
      reportName: "Employee_Salary_Report",  // report link name
      fields: {                              // field link names in the report
        employee: "Employee_Name",
        date: "Date_field",
        variant: "Packing_Variant",
        quantity: "Quantity",
        amount: "Amount"
      }
    };

    /* ================= COMPANY / VARIANT / EMPLOYEE MASTER (from Pay_Sheet.xlsx) =================
       Group: 1.KATTU SALARY FOR UNITS  கட்டு சம்பளம் | Period: 1-Oct-26 to 31-Oct-26
       COMPANIES : [company, Tamil name]
       EMP_MASTER: [company, employee label, Tamil name]
       PAY_DATA  : [employee index, variant index, quantity, amount]  (one row per employee + variant) */

    function isoLocal(d) {

      $("fStart").disabled = $("fEnd").disabled = p !== "custom";

      if (p === "today") {
        label = "Today";

        label = "Pick any day in the week";
        if (!$("fWeekDay").value) $("fWeekDay").value = isoLocal(new Date());

      } else if (p === "month") {

        range = monthRange(+$("fYear").value, +$("fMonth").value);
      } else if (p === "year") {

        range = yearRange(+$("fYear").value);
      } else if (p === "all") {

        });
        $("tbody").innerHTML = html;
        $("tfoot").innerHTML = '<tr><td colspan="4">Grand Total</td><td class="num">' + fmtAmt(totalAmt) + "</td></tr>";
      }

      $("recCount").textContent = fmtNum(filtered.length) + (filtered.length === 1 ? " record" : " records");
      renderChips();
    }

    function renderChips() {
      var chips = [];
      chips.push(state.employee ? "Employee: " + esc(state.employee) : "All Employees");
      chips.push(state.variant ? "Variant: " + esc(state.variant) : "All Variants");
      if (state.periodText) chips.push(esc(state.periodText));
      $("activeFilters").innerHTML = chips.map(function (c) { return '<span class="chip">' + c + "</span>"; }).join("");
    }

    /* ================= EVENTS ================= */
    function doApply() {
      var start = $("fStart").value, end = $("fEnd").value, err = $("formError");
      if (start && end && start > end) {
        err.textContent = "Start Date cannot be after End Date.";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      state.employee = $("fEmployee").value;
      state.variant = $("fVariant").value;
      state.start = start;
      state.end = end;
      state.periodText = periodText();
      state.page = 1;
      applyFilters();
    }

    $("filterForm").addEventListener("submit", function (e) {
      e.preventDefault();
      doApply();
    });

    // Changing the variant narrows the employee list to that variant's employees.
    $("fVariant").addEventListener("change", function () { populateEmployees(); doApply(); });

    ["fPeriod", "fWeekDay", "fMonth", "fYear"].forEach(function (id) {
      $(id).addEventListener("change", function () { syncPeriod(); clearPresetHighlight(); });
    });
    ["fStart", "fEnd"].forEach(function (id) {
      $(id).addEventListener("change", clearPresetHighlight);
    });

    $("presets").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-preset]");
      if (b) applyPreset(b.dataset.preset);
    });

    $("btnReset").addEventListener("click", function () {
      $("filterForm").reset();
      $("fWeekDay").value = "";
      populateEmployees();
      populateYears();
      syncPeriod();
      clearPresetHighlight();
      $("fSearch").value = "";
      $("formError").style.display = "none";
      state.employee = state.variant = state.start = state.end = state.periodText = state.search = "";
      state.page = 1;
      applyFilters();
    });

    $("fSearch").addEventListener("input", function () {
      state.search = this.value.trim();
      state.page = 1;
      applyFilters();
    });

    $("btnPrint").addEventListener("click", function () { window.print(); });

    $("btnExport").addEventListener("click", function () {
      var csv = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
      var lines = [["S.No", "Company", "Packing Variant", "Employee Name", "Date", "Quantity", "Unit", "Amount"].join(",")];
      var a = 0;
      filtered.slice().sort(function (x, y) {
        var cx = COMPANIES.map(function (c) { return c[0]; }).indexOf(x.company), cy = COMPANIES.map(function (c) { return c[0]; }).indexOf(y.company);
        return (cx - cy) || (PACKING_VARIANTS.indexOf(x.variant) - PACKING_VARIANTS.indexOf(y.variant)) || (x.base < y.base ? -1 : 1);
      }).forEach(function (r, i) {
        a += r.amount;
        lines.push([i + 1, csv(r.company), csv(shortVariant(r.variant)), csv(displayName(r)), fmtDate(r.date), r.quantity, csv(unitOf(r.variant)), r.amount.toFixed(2)].join(","));
      });
      lines.push(["", "", "", "Grand Total", "", "", "", a.toFixed(2)].join(","));
      var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Employee_Salary_Report.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    /* ================= INIT ================= */
    loadData().then(function (records) {
      allRecords = records;
      allRecords.forEach(function (r) { r.company = EMP_COMPANY[r.employee] || ""; r.base = baseName(r.employee); });
      populateVariants();
      populateEmployees();
      populateYears();
      syncPeriod();
      applyFilters();   // page opens with all employee details
    });
  </script>
</body>

</html>
